name: "Packaging Test"

on: [pull_request]
jobs:
  check_packaging:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the package
        run: |
          uv build
      - name: Check the built distributions
        run: |
          uv publish --dry-run dist/*
