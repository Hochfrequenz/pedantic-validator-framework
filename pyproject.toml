[project]
name = "pvframework"
description = "This framework enables to easily create validation functions (both sync or async) and managers to easily apply this validation logic onto arbitrary object structures."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["python", "validation", "structures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bidict",
    "frozendict",
    "networkx",
    "typeguard",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/pedantic-validator-framework/releases"
Homepage = "https://github.com/Hochfrequenz/pedantic-validator-framework"

[dependency-groups]
tests = [
    "pydantic==2.13.5",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0"
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"}
]
linting = [
    "ruff==0.16.5"
]
spell_check = [
    "codespell==2.4.3"
]
type_check = [
    "mypy==1.15.0",
    "networkx-stubs==0.0.1",
    "types-frozendict==2.0.9",
    {include-group = "tests"}
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "coverage"},
    {include-group = "linting"},
    {include-group = "spell_check"},
    {include-group = "type_check"}
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "N",
    "PL",
    "RUF",
    "SIM",
    "C4",
    "PTH",
    "PT",
    "RET",
    "ARG",
    "TC",
    "PIE",
    "RSE",
    "ISC",
    "S",
]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "PLR0912",  # too-many-branches
    "PLR0915",  # too-many-statements
    "PLR2004",  # magic-value-comparison
    "ISC001",   # single-line-implicit-string-concatenation (conflicts with ruff format)
]

[tool.ruff.lint.per-file-ignores]
# --- Standing globs (hand-written; cover files that may not exist yet) ---
# unittests use asserts (S101) as their core assertion mechanism.
"unittests/**" = [
    "S101",  # assert
]
# --- Grandfathered existing violations (generated; zero lint churn) ---
# The entries below freeze the ruff violations that already existed when black/isort/pylint
# were replaced by ruff, so no source had to change. New/changed code is held to the full
# rule set. See the PR discussion for the recommended burn-down follow-up.
"src/pvframework/__init__.py" = ["F401"]  # unused-import
"src/pvframework/analysis.py" = ["S101", "UP045"]  # assert, non-pep604-annotation-optional
"src/pvframework/errors.py" = ["S101", "S311", "UP035", "UP041", "UP045"]  # assert, suspicious-non-cryptographic-random-usage, deprecated-import, timeout-error-alias, non-pep604-annotation-optional
"src/pvframework/execution.py" = ["PLR5501", "S101", "UP035", "UP045"]  # collapsible-else-if, assert, deprecated-import, non-pep604-annotation-optional
"src/pvframework/mapped_validators/__init__.py" = ["F401"]  # unused-import
"src/pvframework/mapped_validators/path_map.py" = ["UP035"]  # deprecated-import
"src/pvframework/mapped_validators/query_map.py" = ["B905", "S101", "UP035", "UP045"]  # zip-without-explicit-strict, assert, deprecated-import, non-pep604-annotation-optional
"src/pvframework/mapped_validators/query_parallel_map.py" = ["S101", "UP035", "UP045"]  # assert, deprecated-import, non-pep604-annotation-optional
"src/pvframework/types.py" = ["UP035"]  # deprecated-import
"src/pvframework/utils/__init__.py" = ["F401"]  # unused-import
"src/pvframework/utils/frame_functions.py" = ["S101", "UP045"]  # assert, non-pep604-annotation-optional
"src/pvframework/utils/query_object.py" = ["TC005", "UP045"]  # empty-type-checking-block, non-pep604-annotation-optional
"src/pvframework/validator.py" = ["ARG004", "C401", "RUF021", "UP035", "UP045"]  # unused-static-method-argument, unnecessary-generator-set, parenthesize-chained-operators, deprecated-import, non-pep604-annotation-optional
"unittests/test_complex_examples.py" = ["UP035", "UP045"]  # deprecated-import, non-pep604-annotation-optional
"unittests/test_validation.py" = ["ARG001", "PLW0603", "PT006", "PT011", "PT018", "SIM300", "UP035", "UP045"]  # unused-function-argument, global-statement, pytest-parametrize-names-wrong-type, pytest-raises-too-broad, pytest-composite-assertion, yoda-conditions, deprecated-import, non-pep604-annotation-optional

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"



[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_pvframework_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
# When the mode is auto, all discovered async tests are considered asyncio-driven
# even if they have no @pytest.mark.asyncio marker.
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"
