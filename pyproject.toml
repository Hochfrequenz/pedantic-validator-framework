[project]
name = "pvframework"
description = "This framework enables to easily create validation functions (both sync or async) and managers to easily apply this validation logic onto arbitrary object structures."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["python", "validation", "structures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bidict",
    "frozendict",
    "networkx",
    "typeguard",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/pedantic-validator-framework/releases"
Homepage = "https://github.com/Hochfrequenz/pedantic-validator-framework"

[dependency-groups]
tests = [
    "pydantic==2.11.10",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0"
]
coverage = [
    "coverage==7.11.3",
    {include-group = "tests"}
]
formatting = [
    "black==25.11.0",
    "isort==7.0.0"
]
linting = [
    "pylint==3.2.7",
    {include-group = "tests"}
]
spell_check = [
    "codespell==2.4.1"
]
type_check = [
    "mypy==1.15.0",
    "networkx-stubs==0.0.1",
    "types-frozendict==2.0.9",
    {include-group = "tests"}
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "coverage"},
    {include-group = "linting"},
    {include-group = "spell_check"},
    {include-group = "type_check"}
    # NOTE: the "formatting" group (black/isort) is intentionally NOT included here:
    # pylint==3.2.7 requires isort<6 but formatting pins isort==7.0.0, so the two
    # cannot share one environment (see [tool.uv] conflicts). black/isort run via
    # pre-commit's own isolated environments and the formatting CI job.
]

[tool.uv]
default-groups = []
# pylint 3.2.7 requires isort<6, while the formatting group pins isort==7.0.0.
# These two groups are never used together in the same CI job, so declare them as
# conflicting to let uv resolve each independently (they ran in separate CI jobs).
conflicts = [
    [{ group = "formatting" }, { group = "linting" }],
]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120
disable="too-few-public-methods"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"



[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_pvframework_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
# When the mode is auto, all discovered async tests are considered asyncio-driven
# even if they have no @pytest.mark.asyncio marker.
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"
